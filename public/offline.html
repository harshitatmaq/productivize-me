<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#08090a" />
    <title>Offline · Productivize</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #08090a; color: #f7f8f8;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }
      .card { text-align: center; padding: 32px; max-width: 340px; }
      img { width: 56px; height: 56px; border-radius: 14px; margin-bottom: 20px; }
      h1 { font-size: 20px; font-weight: 600; margin: 0 0 8px; letter-spacing: -0.01em; }
      p { color: #8a8f98; font-size: 14px; line-height: 1.6; margin: 0 0 20px; }
      button { background: #5e6ad2; color: #fff; border: 0; border-radius: 10px; padding: 10px 16px; font-size: 14px; font-weight: 600; }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>Productivize needs a connection to sync your tasks. It'll pick up right where you left off.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
